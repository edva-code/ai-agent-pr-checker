name: tracker
version: "0.1.0"
profile: tracker

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]

models:
  tracker:
    # Tables, not views: each test on a view re-reads and re-dedupes every event file
    staging:
      +materialized: table
    intermediate:
      +materialized: table
    marts:
      +materialized: table

seeds:
  tracker:
    agent_rules:
      +column_types:
        agent: varchar
        match_type: varchar
        pattern: varchar
        priority: integer
