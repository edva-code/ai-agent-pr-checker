version: 2

models:
  - name: fct_prs
    description: One row per PR opened in the loaded window, labelled with its agent.
    columns:
      - name: pr_id
        data_tests: [unique, not_null]
      - name: agent
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('agent_names')
                field: agent
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [merged, closed, open]
  - name: agg_daily_metrics
    description: PRs opened, merged and merge rate per agent per day.
    columns:
      - name: merge_rate
        data_tests: [not_null]
      - name: capture_quality
        data_tests:
          - accepted_values:
              arguments:
                values: [ok, low, partial]
  - name: capture_health
    description: One row per hour, flagging missing hours and unusual PR volume.
    columns:
      - name: hour
        data_tests: [unique, not_null]
      - name: capture_flag
        data_tests:
          - accepted_values:
              arguments:
                values: [ok, low, high, missing]
  - name: agg_daily_capture
    description: Hours present, capture quality and capture warnings per day.
    columns:
      - name: day
        data_tests: [unique, not_null]
      - name: capture_quality
        data_tests:
          - accepted_values:
              arguments:
                values: [ok, low, partial]
      - name: volume_low
        data_tests: [not_null]
      - name: pr_share_low
        data_tests: [not_null]
      - name: no_merges
        data_tests: [not_null]
  - name: capture_monthly_volume
    description: Average events per captured hour per source and month, against the previous unflagged months.
    columns:
      - name: month
        data_tests: [not_null]
      - name: volume_low
        data_tests: [not_null]
