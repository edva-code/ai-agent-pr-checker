[project]
name = "ai-agent-pr-tracker"
version = "0.1.0"
description = "Tracks how AI coding agents open pull requests across public GitHub, using GH Archive."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-duckdb>=1.11.0",
    "pyarrow>=17",
    "requests>=2.32",
    "streamlit>=1.65.0",
]

[project.scripts]
tracker-ingest = "tracker.ingest:main"

[dependency-groups]
dev = [
    "duckdb>=1.1",
    "pytest>=8",
    "ruff>=0.6",
    "vl-convert-python>=1.9.0.post1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracker"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
